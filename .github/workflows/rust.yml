name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: build (${{ matrix.target }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

                    - os: macos-latest
                      target: x86_64-apple-darwin

                    - os: macos-latest
                      target: aarch64-apple-darwin

                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v7

            - name: Add target
              run: rustup target add ${{ matrix.target }}

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}

            - name: Strip binary
              shell: bash
              run: |
                  BIN="renord"
                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                    BIN="renord.exe"
                  fi

                  strip target/${{ matrix.target }}/release/$BIN || true

            - name: Package
              shell: bash
              run: |
                  BIN="renord"
                  EXT="tar.gz"

                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                    BIN="renord.exe"
                    EXT="zip"
                  fi

                  OUT="renord-${{ matrix.target }}.$EXT"

                  mkdir -p dist
                  cp target/${{ matrix.target }}/release/$BIN dist/

                  if [[ "$EXT" == "zip" ]]; then
                    cd dist
                    7z a "$OUT" "$BIN"
                  else
                    tar -czf "dist/$OUT" -C dist "$BIN"
                  fi

            - name: Checksum
              shell: bash
              run: |
                  cd dist
                  shasum -a 256 renord-${{ matrix.target }}.* > renord-${{ matrix.target }}.sha256

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Upload Release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: dist/*
                  fail_on_unmatched_files: true
